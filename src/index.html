<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Bel Kegiatan eNJe</title>
  <link rel="icon" type="image/png" href="./icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    .bell-ringing-anim {
      animation: pulse-ring 2s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden relative">
  
  <!-- Top Banner Status (Fokus Bel Kegiatan Harian & Waktu Lengkap) -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex justify-between items-center shadow-lg z-10">
    <!-- Kiri: Info Bel Kegiatan Selanjutnya & Logo Aplikasi -->
    <div class="flex items-center space-x-4">
      <div class="w-12 h-12 bg-red-500/10 p-1.5 rounded-2xl border border-red-500/30 flex items-center justify-center shadow">
        <img src="./icon.png" alt="Logo eNJe" class="w-full h-full object-contain">
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <span class="text-xs px-2.5 py-0.5 bg-blue-500/20 text-blue-400 rounded-lg font-bold border border-blue-500/20">Bel Selanjutnya</span>
          <span class="text-xs font-mono text-slate-400" id="top-status-time">Pukul --:-- WIB</span>
        </div>
        <h2 class="text-base font-bold text-slate-100 mt-0.5" id="top-status-title">Memuat jadwal kegiatan...</h2>
      </div>
    </div>

    <!-- Kanan: Hari, Tanggal, Bulan, Tahun & Jam Real-time & Hitung Mundur -->
    <div class="flex items-center space-x-6">
      <!-- Info Hari, Tanggal, Bulan, Tahun -->
      <div class="text-right">
        <div class="text-[11px] text-slate-400 font-medium" id="live-date-header">Memuat tanggal...</div>
        <div class="text-lg font-mono font-bold text-slate-100 tracking-wider" id="live-clock-header">00:00:00</div>
      </div>

      <div class="h-8 w-[1px] bg-slate-800"></div>

      <!-- Hitung Mundur -->
      <div class="text-right">
        <div class="text-[11px] text-slate-400 font-medium">Akan berbunyi dalam</div>
        <div class="text-lg font-mono font-bold text-blue-400 tracking-wider" id="top-countdown">00:00:00</div>
      </div>

      <button onclick="playTestAudio()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold flex items-center space-x-2 transition shadow">
        <i class="fa-solid fa-play text-blue-400"></i><span>Tes Bel</span>
      </button>

      <!-- Tombol Cek Pembaruan -->
      <button onclick="checkForAppUpdates()" id="btn-check-update" class="px-3.5 py-2.5 bg-slate-800 hover:bg-blue-600 text-slate-300 hover:text-white border border-slate-700 rounded-xl text-xs font-semibold flex items-center space-x-2 transition shadow" title="Cek Update Aplikasi">
        <i class="fa-solid fa-cloud-arrow-down text-emerald-400"></i><span>Cek Update</span>
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="bg-slate-900/50 border-b border-slate-800 px-6 py-2.5 flex space-x-4 z-10">
    <button onclick="switchTab('routine')" id="nav-routine" class="px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white flex items-center space-x-2 transition shadow">
      <i class="fa-solid fa-clock"></i><span>Bel Kegiatan Harian</span>
    </button>
    <button onclick="switchTab('prayer')" id="nav-prayer" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 flex items-center space-x-2 transition">
      <i class="fa-solid fa-mosque"></i><span>Jadwal Shalat & Bel Pre-Shalat</span>
      <span class="text-[10px] bg-slate-800 text-blue-400 px-1.5 py-0.5 rounded border border-blue-500/20">Digital Falak</span>
    </button>
     <button onclick="switchTab('calendar')" id="nav-calendar" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 flex items-center space-x-2 transition">
      <i class="fa-solid fa-calendar-days"></i>
      <span>Kalender Masehi & Hijriah</span>
    </button>
    <button onclick="switchTab('history')" id="nav-history" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-800 flex items-center space-x-2 transition">
      <i class="fa-solid fa-list-check"></i><span>Riwayat & Log Bel</span>
    </button>
  </nav>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 overflow-y-auto bg-slate-950">
    <div id="view-routine"></div>
    <div id="view-prayer" class="hidden"></div>
    <div id="view-calendar" class="p-6 hidden"></div>
    <div id="view-history" class="hidden"></div>
  </main>

  <!-- POP-UP FLOATING DIALOG KETIKA BEL SEDANG BERBUNYI -->
  <div id="active-bell-modal" class="fixed inset-0 bg-black/75 backdrop-blur-md hidden flex justify-center items-center z-50 transition-all duration-300">
    <div class="bg-slate-900 border-2 border-red-500/60 p-7 rounded-3xl w-full max-w-md text-center shadow-2xl bell-ringing-anim space-y-5">
      <div class="w-20 h-20 mx-auto bg-red-500/10 border border-red-500/30 rounded-2xl flex items-center justify-center p-2 shadow-lg">
        <img src="./icon.png" alt="Logo Bel" class="w-full h-full object-contain animate-bounce">
      </div>
      <div>
        <span id="active-bell-source-badge" class="px-3 py-1 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-full text-[10px] font-bold uppercase tracking-wider">
          Bel Sedang Berbunyi
        </span>
        <h3 id="active-bell-title" class="text-xl font-bold text-white mt-3">Nama Kegiatan / Shalat</h3>
        <p id="active-bell-time-info" class="text-xs text-slate-400 mt-1 font-mono">Waktu Eksekusi: --:-- WIB</p>
      </div>

      <!-- Kontrol Pause / Stop Audio -->
      <div class="flex justify-center items-center space-x-3 pt-2">
        <button onclick="toggleActiveBellPause()" id="btn-active-bell-pause" class="px-5 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-2xl text-xs font-semibold flex items-center space-x-2 transition shadow">
          <i id="active-bell-pause-icon" class="fa-solid fa-pause"></i>
          <span id="active-bell-pause-text">Jeda (Pause)</span>
        </button>
        <button onclick="stopActiveBell()" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white rounded-2xl text-xs font-bold flex items-center space-x-2 transition shadow-lg shadow-red-600/30">
          <i class="fa-solid fa-stop"></i>
          <span>Hentikan Suara (Stop)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- POP-UP NOTIFIKASI UPDATE TERSEDIA -->
  <div id="update-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex justify-center items-center z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-2xl space-y-4">
      <div class="flex items-center space-x-3 text-emerald-400 pb-3 border-b border-slate-800">
        <i class="fa-solid fa-circle-arrow-up text-2xl"></i>
        <div>
          <h3 class="text-sm font-bold text-white">Pembaruan Tersedia!</h3>
          <p id="update-version-label" class="text-[11px] text-slate-400">Versi baru v1.1.0 telah dirilis.</p>
        </div>
      </div>
      <div>
        <label class="block text-[11px] font-semibold text-slate-300 mb-1">Catatan Pembaruan (Changelog):</label>
        <div id="update-changelog" class="bg-slate-950 border border-slate-800/80 p-3 rounded-xl text-xs text-slate-300 max-h-36 overflow-y-auto space-y-1">
          Memuat catatan...
        </div>
      </div>
      <div class="flex justify-end space-x-3 pt-3 border-t border-slate-800">
        <button onclick="closeUpdateModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 font-medium">Nanti Saja</button>
        <button onclick="downloadAndApplyUpdate()" id="btn-apply-update" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-xl text-xs font-semibold text-white flex items-center space-x-1.5 shadow">
          <i class="fa-solid fa-download"></i>
          <span>Unduh & Update Sekarang</span>
        </button>
      </div>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
